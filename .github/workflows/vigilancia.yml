name: Vigilancia de marcas INAPI

on:
  schedule:
    - cron: "17 12 * * *"   # todos los días ~09:17 hora de Chile (12:17 UTC)
  workflow_dispatch: {}      # botón "Run workflow" para revisar cuando quieras
  push:
    paths:
      - "palabras_clave.txt" # al cambiar las marcas, revisa de inmediato

permissions:
  contents: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Santiago
      GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
      GMAIL_CLAVE_APP: ${{ secrets.GMAIL_CLAVE_APP }}
      AVISO_PARA: ${{ secrets.AVISO_PARA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar componentes
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar INAPI
        run: python vigilancia_nube.py

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "vigilancia-inapi[bot]"
          git config user.email "vigilancia-inapi@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Revisión INAPI $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push || true

      - name: Guardar diagnóstico si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: |
            diagnostico/
            datos/
          retention-days: 14
